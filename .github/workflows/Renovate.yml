name: "Renovate"

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: "false"
        required: false
      logLevel:
        description: Log Level
        default: debug
        required: false
      version:
        description: Renovate version
        default: full
        required: false
  schedule:
    - cron: "0 11 * * *" # 11:00 Every day
  push:
    branches: ["main"]
    paths:
      - .github/renovate.json5
      - .github/renovate/**.json5

env:
  LOG_LEVEL: "${{ inputs.logLevel || 'debug' }}"
  RENOVATE_AUTODISCOVER: true
  RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
  RENOVATE_DRY_RUN: "${{ inputs.dryRun == true }}"
  RENOVATE_PLATFORM: github
  RENOVATE_PLATFORM_COMMIT: true
  # Global-only options (rejected if set in renovate.json5)
  RENOVATE_ALLOWED_COMMANDS: '["^bazel mod deps --lockfile_mode=update$", "^bazel run @rules_go//go -- mod tidy$"]'
  # The container ships an empty ~/.android-sdk which makes transitive
  # rules_android hard-fail during bazel analysis; point it at a missing
  # path so the SDK repo rule no-ops like on dev machines.
  RENOVATE_CUSTOM_ENV_VARIABLES: '{"ANDROID_HOME": "/nonexistent-android-sdk"}'
  RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["bazelModDeps"]'
  WORKFLOW_RENOVATE_VERSION: "${{ inputs.version || 'full' }}"

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: "${{ steps.app-token.outputs.token }}"
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@v41.0.8
        with:
          configurationFile: .github/renovate.json5
          token: "${{ steps.app-token.outputs.token }}"
          renovate-version: "${{ env.WORKFLOW_RENOVATE_VERSION }}"
