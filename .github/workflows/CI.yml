name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Restore Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            /tmp/bazel-repository-cache
            /tmp/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Check module resolution and lockfile
        run: bazel build --nobuild --config=ci //...

      - name: Run tests
        run: bazel test --config=ci //...

  container-matrix:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect container changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            container:
              - 'infra/containers/**'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '**/*.MODULE.bazel'

      - name: Set up Bazel
        if: steps.changes.outputs.container == 'true' || github.event_name == 'workflow_dispatch'
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Restore Bazel caches
        if: steps.changes.outputs.container == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: |
            /tmp/bazel-repository-cache
            /tmp/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Generate matrix
        id: generate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ steps.changes.outputs.container }}" != "true" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(bazel query --config=ci 'kind("oci_push", //infra/containers/...)' | jq -R -s -c '{"include": [split("\n")[] | select(. != "")] | map({target: .})}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  push-images:
    needs: container-matrix
    if: github.ref == 'refs/heads/main' && needs.container-matrix.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.container-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Restore Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            /tmp/bazel-repository-cache
            /tmp/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: bazel run --config=ci ${{ matrix.target }}
