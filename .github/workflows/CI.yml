name: Bazel CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Restore Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            .bazel-repository-cache
            .bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Check module resolution and lockfile
        run: bazel build --nobuild --config=ci //...

      - name: Run tests
        run: bazel test --config=ci //...
