name: Push docker images

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/containers/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/docker.yml"

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Restore Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            /tmp/bazel-repository-cache
            /tmp/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Generate Matrix
        id: generate-matrix
        run: |
          MATRIX=$(bazel query --config=ci 'kind("oci_push", //infra/containers/...)' | jq -R -s -c '{"include": [split("\n")[] | select(. != "")] | map({target: .})}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  push-images:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: needs.build-matrix.outputs.matrix != '[]'
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Restore Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            /tmp/bazel-repository-cache
            /tmp/bazel-disk-cache
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.MODULE.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: bazel run --config=ci ${{matrix.target}}
